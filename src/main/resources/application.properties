# DATABASE CONFIGURATION
spring.datasource.url=jdbc:mysql://localhost:3306/flower_shop_db?allowPublicKeyRetrieval=true&useSSL=false&createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA/HIBERNATE CONFIGURATION
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# JWT SECURITY CONFIGURATION
jwt.secret=myVeryLongSuperSecretJwtKeyForFlowerShopApplication2026Secure
# 30 ditë në millisekonda
jwt.expiration=2592000000